services:
  - type: web
    name: quiz-platform
    env: python
    plan: free
    buildCommand: |
      cd backend && pip install -r requirements.txt && cd ../frontend && npm ci --no-audit && npx react-scripts build
    startCommand: cd backend && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000